name: Load Historical Data

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  load-history:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Download historical data (3 years)
        run: python3 load_robusta_history_improved.py
      
      - name: Update dashboard with all data
        run: python3 update_robusta_dashboard.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Add 3 years of historical Robusta data - $(date +'%Y-%m-%d')"
          git push
```

